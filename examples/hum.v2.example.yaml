# hum v2 project configuration for Demo.
#
# Once v2 registry support lands, register it in ~/.config/hum/config.yaml:
#
#   version: 1
#   projects:
#     demo:
#       config: ~/code/demo/hum.yaml
#
# Machine-specific values belong in hum.local.yaml next to this file.
version: 2
project: demo

logs:
  max_file_bytes: 10485760 # 10 MiB per active/rotated stream file
  rotated_files: 3
  max_line_bytes: 65536
  retention: 7d
  redact_patterns:
    - "(?i)(token|password)=[^ ]+"

repositories:
  applications:
    path: ~/code/demo/demo-applications

  api:
    path: ~/code/demo/demo-api

  agents:
    path: ~/code/demo/demo-agents

services:
  frontend:
    repository: applications
    cwd: apps/procurement-frontend
    command: pnpm dev
    port: 5173
    url: http://localhost:5173

    healthcheck:
      type: http
      url: http://localhost:5173
      interval: 2s
      timeout: 1s
      retries: 15

    requires:
      commands:
        - node
        - pnpm
      files:
        - .env.local
      env:
        - VITE_API_URL

    depends_on:
      - api

  api:
    repository: api
    command: pnpm dev
    port: 3000
    url: http://localhost:3000

    healthcheck:
      type: http
      url: http://localhost:3000/health
      interval: 2s
      timeout: 1s
      retries: 20

    requires:
      commands:
        - node
        - pnpm
      files:
        - .env
      env:
        - DATABASE_URL
        - AUTH_SECRET

  agents:
    repository: agents
    command: pnpm dev
    port: 3001

    healthcheck:
      type: tcp
      host: localhost
      port: 3001

    depends_on:
      - api

  storybook:
    repository: applications
    cwd: packages/ui
    command: pnpm storybook
    port: 6006
    url: http://localhost:6006

templates:
  frontend:
    services:
      - frontend
      - api

  backend:
    services:
      - api
      - agents

  ui:
    services:
      - storybook

  all-services:
    services:
      - frontend
      - api
      - agents
      - storybook
