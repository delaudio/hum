# Target hum v2 project configuration for Compri.
# This documents the migration target and is not accepted by the v1 binary.
#
# Once v2 registry support lands, register it in ~/.config/hum/config.yaml:
#
#   version: 1
#   projects:
#     compri:
#       config: ~/code/compri/hum.yaml
#
# Machine-specific values belong in hum.local.yaml next to this file.
version: 2
project: compri

repositories:
  applications:
    path: ~/code/compri/compri-applications

  api:
    path: ~/code/compri/compri-api

  agents:
    path: ~/code/compri/compri-agents

services:
  frontend:
    repository: applications
    cwd: apps/procurement-frontend
    command: pnpm dev
    port: 5173
    url: http://localhost:5173

    healthcheck:
      type: http
      url: http://localhost:5173
      interval: 2s
      timeout: 1s
      retries: 15

    requires:
      commands:
        - node
        - pnpm
      files:
        - .env.local
      env:
        - VITE_API_URL

    depends_on:
      - api

  api:
    repository: api
    command: pnpm dev
    port: 3000
    url: http://localhost:3000

    healthcheck:
      type: http
      url: http://localhost:3000/health
      interval: 2s
      timeout: 1s
      retries: 20

    requires:
      commands:
        - node
        - pnpm
      files:
        - .env
      env:
        - DATABASE_URL
        - AUTH_SECRET

  agents:
    repository: agents
    command: pnpm dev
    port: 3001

    healthcheck:
      type: tcp
      host: localhost
      port: 3001

    depends_on:
      - api

  storybook:
    repository: applications
    cwd: packages/ui
    command: pnpm storybook
    port: 6006
    url: http://localhost:6006

templates:
  frontend:
    services:
      - frontend
      - api

  backend:
    services:
      - api
      - agents

  ui:
    services:
      - storybook

  all-services:
    services:
      - frontend
      - api
      - agents
      - storybook
