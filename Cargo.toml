[package]
name = "hum"
version = "0.6.1"
edition = "2021"
description = "Keep your local stack humming — a local dev process orchestrator TUI/CLI"
license = "MIT"
homepage = "https://github.com/delaudio/hum"
repository = "https://github.com/delaudio/hum"

[[bin]]
name = "hum"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
yaml_serde = "0.10"
anyhow = "1"
async-recursion = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
which = "6"
dirs = "5"
dotenvy = "0.15"
humantime = "2"
humantime-serde = "1"
open = "5"
sysinfo = "0.32"
getrandom = "0.2"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
